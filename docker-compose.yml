services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taalim
      POSTGRES_PASSWORD: taalim
      POSTGRES_DB: taalim_dev
    ports:
      - "5432:5432"
    volumes:
      - taalim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taalim -d taalim_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  taalim_postgres:
